name: Sebnem Ticket Watcher

on:
  workflow_dispatch:

  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  check-ticket:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Biletix ticket status
        id: ticket_check
        run: |
          echo "Biletix kontrol ediliyor..."

          curl -L \
            -A "Mozilla/5.0" \
            -o biletix.html \
            -w "HTTP Status: %{http_code}\n" \
            "https://www.biletix.com/etkinlik/5PSF7/TURKIYE/tr"

          echo "Bilet durumu kontrol ediliyor..."

          if grep -qi "Yakında" biletix.html; then
            echo "Biletler henuz satisa cikmamis."
            echo "ticket_available=false" >> "$GITHUB_OUTPUT"

          elif grep -Eqi "Bilet Al|Satın Al|Bilet Satın Al" biletix.html; then
            echo "Satis isareti bulundu."
            echo "Biletler satisa cikmis olabilir."
            echo "ticket_available=true" >> "$GITHUB_OUTPUT"

          else
            echo "Yakinda ifadesi bulunamadi ama satis isareti de yok."
            echo "Durum belirsiz."
            echo "Yanlis alarm vermemek icin mail gonderilmeyecek."
            echo "ticket_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if notification was already sent
        id: notification_check
        run: |
          if [ -f ".ticket_notified" ]; then
            echo "Bildirim daha once gonderilmis."
            echo "already_notified=true" >> "$GITHUB_OUTPUT"
          else
            echo "Daha once bildirim gonderilmemis."
            echo "already_notified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ticket notification email
        if: |
          steps.ticket_check.outputs.ticket_available == 'true' &&
          steps.notification_check.outputs.already_notified == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}

          subject: "ACIL - Sebnem Ferah Antalya biletleri satisa cikmis olabilir!"

          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Sebnem Ferah Antalya konseri icin
            bilet satis durumu degismis olabilir.

            Biletix sayfasinda satis isareti tespit edildi.

            HEMEN KONTROL ET:

            https://www.biletix.com/etkinlik/5PSF7/TURKIYE/tr

            Konser:
            Sebnem Ferah

            Tarih:
            10 Ekim 2026

            Sehir:
            Antalya

      - name: Mark notification as sent
        if: |
          steps.ticket_check.outputs.ticket_available == 'true' &&
          steps.notification_check.outputs.already_notified == 'false'
        run: |
          echo "Notification sent" > .ticket_notified

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .ticket_notified
          git commit -m "Mark ticket notification as sent"
          git push