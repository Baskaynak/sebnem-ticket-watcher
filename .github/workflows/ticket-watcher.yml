name: Sebnem Ticket Watcher

on:
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest

    steps:
      - name: Check Biletix ticket status
        id: ticket_check
        run: |
          echo "Biletix kontrol ediliyor..."

          curl -L \
            -A "Mozilla/5.0" \
            -o biletix.html \
            -w "HTTP Status: %{http_code}\n" \
            "https://www.biletix.com/etkinlik/5PSF7/TURKIYE/tr"

          echo "Indirilen sayfa boyutu:"
          wc -c biletix.html

          echo "Bilet durumu kontrol ediliyor..."

          if grep -qi "Yakında" biletix.html; then
            echo "Biletler henuz satisa cikmamis."
            echo "ticket_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Yakinda ifadesi bulunamadi!"
            echo "Satis durumu degismis olabilir."
            echo "ticket_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ticket notification email
        if: steps.ticket_check.outputs.ticket_available == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}

          subject: "ACIL - Sebnem Ferah Antalya biletleri satisa cikmis olabilir!"

          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Sebnem Ferah Antalya konseri icin Biletix sayfasinda
            "Yakinda" ifadesi artik bulunamadi.

            Bilet satis durumu degismis olabilir.

            Hemen kontrol et:

            https://www.biletix.com/etkinlik/5PSF7/TURKIYE/tr

            Konser:
            Sebnem Ferah
            10 Ekim 2026
            Antalya