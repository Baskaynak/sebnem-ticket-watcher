name: Sebnem Ticket Watcher

on:
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest

    steps:
      - name: Check Biletix connection
        run: |
          echo "Biletix kontrol ediliyor..."

          curl -L \
            -A "Mozilla/5.0" \
            -o biletix.html \
            -w "HTTP Status: %{http_code}\n" \
            "https://www.biletix.com/etkinlik/5PSF7/TURKIYE/tr"

          echo "Indirilen sayfa boyutu:"
          wc -c biletix.html

          echo "Bilet durumu kontrol ediliyor..."

          if grep -qi "Yakında" biletix.html; then
            echo "Biletler henuz satisa cikmamis."
          else
            echo "Yakinda ifadesi bulunamadi. Satis durumu degismis olabilir!"
          fi

      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}

          subject: "Sebnem Ticket Watcher - Test"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Test basarili!

            GitHub Actions, Gmail uzerinden sana email gonderebiliyor.